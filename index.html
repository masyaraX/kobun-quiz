</style></head><body><main class="wrap"><header><h1>📚 古文重要語 4択チェッカー</h1><p>教科書258〜263ページの例文そのままで全31問。複数の意味もまとめて練習しよう。</p></header><section class="panel"><div class="toolbar"><strong id="counter">問題 1 / 31</strong><span id="page" class="muted"></span></div><div class="progress"><div id="fill" class="fill"></div></div><div class="word" id="word">あかず</div><div class="question" id="question">【教科書 p.258 の例文】&#10;「（更衣を）女御とだに言はせずなりぬるがあかず口惜しうおぼさるれば、」&#10;&#10;例文中の「あかず」の意味は？</div><div class="choices" id="choices"><button type="button" class="choice">1. 満足しない</button><button type="button" class="choice">2. さあ、分からない</button><button type="button" class="choice">3. 言うまでもない</button><button type="button" class="choice">4. さあ、いらっしゃい</button></div><div id="feedback" class="feedback hide" aria-live="polite"></div><div class="actions"><button class="action secondary" id="topDown">①から順番に判定</button><button class="action secondary" id="reset">やり直す</button><button class="action secondary" id="prev">← 前へ</button><button class="action" id="next">次の問題 →</button></div><label for="jump">単語を選んで移動</label><select class="jump" id="jump"></select></section><section class="panel"><h2>収録単語一覧</h2><p class="muted">単語を押すとその問題に移動します。</p><div class="list" id="list"></div></section><section class="panel"><h2>自分の問題を追加</h2><p class="muted">追加した問題はこのブラウザに保存されます。</p><label for="q">問題文</label><textarea id="q"></textarea><label for="opts">選択肢（1行に1つ、4行）</label><textarea id="opts"></textarea><label for="answer">正解の番号</label><select id="answer"><option value="0">1番</option><option value="1">2番</option><option value="2">3番</option><option value="3">4番</option></select><label for="explain">解説</label><textarea id="explain"></textarea><div class="actions"><button class="action" id="add">問題を追加</button><button class="action secondary" id="clearCustom">追加した問題を削除</button></div><p id="saveMsg" class="muted" aria-live="polite"></p></section><footer>写真の教科書（258〜263ページ）を参考にした意味の4択練習です。例文問題ではありません。</footer></main><script>

const initial=[{"word":"あかず","page":258,"q":"【教科書 p.258 の例文】\n「（更衣を）女御とだに言はせずなりぬるがあかず口惜しうおぼさるれば、」\n\n例文中の「あかず」の意味は？","options":["満足しない","さあ、分からない","言うまでもない","さあ、いらっしゃい"],"answer":0,"explain":"「あかず」は満足できず、もの足りないこと。","source":"写真の教科書"},{"word":"あかず","page":258,"q":"【教科書 p.258 の例文】\n「愛敬ありて、言葉多からぬこそ、飽かず向かはまほしけれ。」\n\n例文中の「飽かず」の意味は？","options":["寝る","飽きることがない","表情に出る","摂政"],"answer":1,"explain":"ここでは「飽かず」。飽きずに、いつまでも向き合いたいという意味。","source":"写真の教科書"},{"word":"あからめもせず","page":258,"q":"【教科書 p.258 の例文】\n「花の本にはねぢ寄り立ち寄り、あからめもせずまもりて、」\n\n例文中の「あからめもせず」の意味は？","options":["生き続けて","先ほどの","よそ見もしない","生前の"],"answer":2,"explain":"「あからめもせず」は、ほかに目を向けずに見ること。","source":"写真の教科書"},{"word":"あなかま","page":258,"q":"【教科書 p.258 の例文】\n「あなかま、人に聞かすな。」\n\n例文の「あなかま」が表す気持ちは？","options":["さあ、いらっしゃい","摂政","呆然としている","ああ、うるさい"],"answer":3,"explain":"「あなかま」は人を静かにさせる言葉。「ああ、うるさい」の意味。","source":"写真の教科書"},{"word":"あなかま","page":258,"q":"【教科書 p.258 の例文】\n「あなかま、人に聞かすな。」\n\n同じ例文の「あなかま」は、相手に何を求めている？","options":["静かに","言葉では言い尽くせない","さあ、分からない","どうしようもない"],"answer":0,"explain":"「あなかま」は「ああ、うるさい」「静かに」と訳すことができる。","source":"写真の教科書"},{"word":"あらぬ","page":259,"q":"【教科書 p.259 の例文】\n「あらぬものにいひなしてやみぬるつとめて、」\n\n例文中の「あらぬ」の意味は？","options":["例の","別の","うわさに聞く","結局"],"answer":1,"explain":"「あらぬ」は「別の」。違うものに言い換えてしまった、の意。","source":"写真の教科書"},{"word":"ありありて","page":259,"q":"【教科書 p.259 の例文】\n「ありありてかく遙かなる国になりにたり。」\n\n「ありありて」の、例文での用法とは別の意味は？","options":["呆然としている","静かに","生き続けて","以前の"],"answer":2,"explain":"「ありありて」には「生き続けて」という意味もある。この例文での意味は「結局」。","source":"写真の教科書"},{"word":"ありありて","page":259,"q":"【教科書 p.259 の例文】\n「ありありてかく遙かなる国になりにたり。」\n\n例文中の「ありありて」の意味は？","options":["どうしようもない","言いようもない","満足しない","結局"],"answer":3,"explain":"「ありありて」はここでは「結局」。遠い国に来てしまった、という文脈。","source":"写真の教科書"},{"word":"ありし","page":259,"q":"【教科書 p.259 の例文】\n「わがありしかたちにもあらず、」\n\n例文中の「ありし」の意味は？","options":["以前の","取るに足りない","言いようもなくすばらしい","どうしようもない"],"answer":0,"explain":"この「ありし」は「以前の」。以前の自分の姿でもない、の意。","source":"写真の教科書"},{"word":"ありし","page":259,"q":"【教科書 p.259 の例文】\n「わがありしかたちにもあらず、」\n\n「ありし」の、例文の用法とは別の意味は？","options":["ものの数に入らない","生前の","よそ見もしない","結局"],"answer":1,"explain":"「ありし」には「生前の」という意味もある。例文の用法は「以前の」。","source":"写真の教科書"},{"word":"ありつる","page":259,"q":"【教科書 p.259 の例文】\n「ありつる所に帰りて、」\n\n例文中の「ありつる」の意味は？","options":["呆然としている","関白","先ほどの","取るに足りない"],"answer":2,"explain":"「ありつる」は「先ほどの・例の」。先ほどの場所に帰って、の意。","source":"写真の教科書"},{"word":"ありつる","page":259,"q":"【教科書 p.259 の例文】\n「ありつる所に帰りて、」\n\n「ありつる」を「先ほどの」と同じように訳すなら？","options":["言うまでもない","言いようもない","ものの数に入らない","例の"],"answer":3,"explain":"「ありつる」の「先ほどの」に近いもう一つの訳し方。","source":"写真の教科書"},{"word":"あれかにもあらず","page":260,"q":"【教科書 p.260 の例文】\n「あれかにもあらず、現とも覚えで、」\n\n例文中の「あれかにもあらず」の意味は？","options":["呆然としている","うわさに聞く","結局","取るに足りない"],"answer":0,"explain":"「あれかにもあらず」は自分が自分でないような、呆然とした様子。","source":"写真の教科書"},{"word":"いかがはせむ","page":260,"q":"【教科書 p.260 の例文】\n「いとにくはらだたしけれども、いかがはせむ。」\n\n例文中の「いかがはせむ」の意味は？","options":["関白","どうしようもない","以前の","ものの数に入らない"],"answer":1,"explain":"「いかがはせむ」は反語的に「どうしようもない」。","source":"写真の教科書"},{"word":"いさ知らず","page":260,"q":"【教科書 p.260 の例文】\n「いさ、我は知らず。」\n\n例文中の「いさ」の意味は？","options":["言いようもない","満足しない","さあ、分からない","別の"],"answer":2,"explain":"「いさ知らず」は、答えをためらう「さあ、分からない」。","source":"写真の教科書"},{"word":"いざ給へ","page":260,"q":"【教科書 p.260 の例文】\n「「いざ給へ」とて隣なる所へ率て行く。」\n\n例文中の「いざ給へ」の意味は？","options":["言ってもしかたがない","ああ、うるさい","うわさに聞く","さあ、いらっしゃい"],"answer":3,"explain":"「いざ給へ」は、相手を誘う「さあ、いらっしゃい」。","source":"写真の教科書"},{"word":"いちのひとへの人","page":261,"q":"【教科書 p.261 の例文】\n「この人の御有様はさらなり、従人も、舎人など賜はる際は、ゆゆしと見ゆ。」\n\nこの例文の「この人」の説明にある「一の人」が指す役職の一つは？","options":["摂政","言いようもなくすばらしい","寝る","飽きることがない"],"answer":0,"explain":"「いちのひとへの人（一の人）」は摂政・関白を指す言い方。例文の「この人」についての解説。","source":"写真の教科書"},{"word":"いちのひとへの人","page":261,"q":"【教科書 p.261 の例文】\n「この人の御有様はさらなり、従人も、舎人など賜はる際は、ゆゆしと見ゆ。」\n\n「一の人」が指す役職で、摂政のほかにあるものは？","options":["よそ見もしない","関白","結局","取るに足りない"],"answer":1,"explain":"「一の人」は摂政・関白を指す。この問題はもう一方の役職を問う。","source":"写真の教科書"},{"word":"いとしもなし","page":261,"q":"【教科書 p.261 の例文】\n「いとしもあらぬ御心ざしなれど、」\n\n例文中の「いとしもあらぬ」の意味は？","options":["言葉では言い尽くせない","別の","たいしたこともない","静かに"],"answer":2,"explain":"「いとしもなし」は「たいしたこともない」。写真では「いとしもあらぬ」の形。","source":"写真の教科書"},{"word":"いはむかたなし","page":261,"q":"【教科書 p.261 の例文】\n「言はむ方なくむくつけなるもの来て、」\n\n例文中の「言はむ方なく」の意味は？","options":["摂政","呆然としている","関白","言いようもない"],"answer":3,"explain":"「言はむ方なし」は「言いようもない」。","source":"写真の教科書"},{"word":"いふかひなし","page":262,"q":"【教科書 p.262 の例文】\n「男の童の物怖ぢせず、いふかひなきを召し寄せて、」\n\n「いふかひなし」の、例文での用法とは別の意味は？","options":["言ってもしかたがない","さあ、いらっしゃい","ものの数に入らない","呆然としている"],"answer":0,"explain":"「いふかひなし」には「言ってもかいがない」という意味もある。この例文は「取るに足りない」の用法。","source":"写真の教科書"},{"word":"いふかひなし","page":262,"q":"【教科書 p.262 の例文】\n「男の童の物怖ぢせず、いふかひなきを召し寄せて、」\n\n例文中の「いふかひなき」の意味は？","options":["関白","取るに足りない","先ほどの","言いようもなくすばらしい"],"answer":1,"explain":"この文脈の「いふかひなき」は「取るに足りない・つまらない」。","source":"写真の教科書"},{"word":"（と）いふもおろかなり","page":262,"q":"【教科書 p.262 の例文】\n「いと心細しと言へばおろかなり。」\n\n例文中の「と言へばおろかなり」の意味は？","options":["生き続けて","取るに足りない","言葉では言い尽くせない","ああ、うるさい"],"answer":2,"explain":"「言へばおろかなり」は、そう言うだけでは足りないということ。","source":"写真の教科書"},{"word":"いふもさらなり","page":262,"q":"【教科書 p.262 の例文】\n「軸や表紙や箱のさまなどいへばさらなりかし。」\n\n例文中の「いへばさらなり」の意味は？","options":["以前の","生前の","よそ見もしない","言うまでもない"],"answer":3,"explain":"「いへばさらなり」は「言うまでもない」。","source":"写真の教科書"},{"word":"いふもさらなり","page":262,"q":"【教科書 p.262 の例文】\n「妻子どもはさらにもいはず、」\n\n例文中の「さらにもいはず」の意味は？","options":["言うまでもない","摂政","呆然としている","関白"],"answer":0,"explain":"「さらにもいはず」も同じく「言うまでもない」。教科書の2つ目の例文。","source":"写真の教科書"},{"word":"色に出づ","page":262,"q":"【教科書 p.262 の例文】\n「忍ぶれど色に出でにけりわが恋は物や思ふと人の問ふまで」\n\n例文中の「色に出でにけり」の意味は？","options":["飽きることがない","表情に出る","言葉では言い尽くせない","言いようもなくすばらしい"],"answer":1,"explain":"「色に出づ」は、隠した思いが顔色や態度に表れてしまうこと。","source":"写真の教科書"},{"word":"寝を寝","page":263,"q":"【教科書 p.263 の例文】\n「恐ろしくて寝も寝られず。」\n\n例文中の「寝も寝られず」の「寝」の意味は？","options":["取るに足りない","例の","寝る","よそ見もしない"],"answer":2,"explain":"「寝を寝」は「寝る」の意味。例文では「寝も寝られず」の形。","source":"写真の教科書"},{"word":"えならず","page":263,"q":"【教科書 p.263 の例文】\n「珍しく、えならぬ調度ども並べおき、」\n\n例文中の「えならぬ」の意味は？","options":["生き続けて","取るに足りない","ああ、うるさい","言いようもなくすばらしい"],"answer":3,"explain":"「えならず」は何とも言えないほどすばらしいこと。","source":"写真の教科書"},{"word":"音に聞く","page":263,"q":"【教科書 p.263 の例文】\n「音には聞けども、いまだ見ぬ物なり。」\n\n例文中の「音には聞けども」の意味は？","options":["うわさに聞く","摂政","たいしたこともない","生き続けて"],"answer":0,"explain":"「音に聞く」は「うわさに聞く」。評判を耳にすること。","source":"写真の教科書"},{"word":"数ならず","page":263,"q":"【教科書 p.263 の例文】\n「数ならぬ身はえ聞き候はず。」\n\n例文中の「数ならぬ」の意味は？","options":["別の","ものの数に入らない","静かに","以前の"],"answer":1,"explain":"「数ならず」は、ものの数に入れられないということ。","source":"写真の教科書"},{"word":"数ならず","page":263,"q":"【教科書 p.263 の例文】\n「数ならぬ身はえ聞き候はず。」\n\n「数ならず」を「ものの数に入らない」と同じ意味で訳すなら？","options":["どうしようもない","言いようもない","取るに足りない","生前の"],"answer":2,"explain":"「数ならず」は「取るに足りない」とも訳せる。前問と同じ例文。","source":"写真の教科書"}];let custom=[];try{custom=JSON.parse(localStorage.getItem('kobun_custom')||'[]');if(!Array.isArray(custom))custom=[]}catch(e){}let idx=0;const $=id=>document.getElementById(id),all=()=>[...initial,...custom];function go(i){idx=(i+all().length)%all().length;render()}function render(){const p=all()[idx];$('counter').textContent=`問題 ${idx+1} / ${all().length}`;$('page').textContent=p.page?`教科書 p.${p.page}`:'追加した問題';$('fill').style.width=`${(idx+1)/all().length*100}%`;$('word').textContent=p.word||'追加問題';$('question').textContent=p.q;$('feedback').classList.add('hide');$('feedback').textContent='';$('choices').replaceChildren();p.options.forEach((o,i)=>{const b=document.createElement('button');b.className='choice';b.textContent=`${i+1}. ${o}`;b.onclick=()=>check(i);$('choices').appendChild(b)});$('jump').replaceChildren();$('list').replaceChildren();all().forEach((e,i)=>{const opt=document.createElement('option');opt.value=i;opt.textContent=`${i+1}. ${e.word||'追加問題'}`;$('jump').appendChild(opt);const b=document.createElement('button');b.className='item'+(idx===i?' active':'');b.textContent=`${i+1}. ${e.word||'追加問題'}`;b.onclick=()=>go(i);$('list').appendChild(b)});$('jump').value=String(idx)}function check(i){const p=all()[idx],buttons=[...$('choices').children],f=$('feedback');buttons[i].classList.add(i===p.answer?'correct':'wrong');buttons[i].disabled=true;f.classList.remove('hide');if(i===p.answer){f.textContent=`⭕ 正解！ ${i+1}番「${p.options[i]}」
${p.explain}`;buttons.forEach((b,j)=>{b.disabled=true;if(j===p.answer)b.classList.add('correct')})}else{f.textContent=`❌ ${i+1}番は不正解。別の選択肢を選んでください。`}}$('topDown').onclick=()=>{const p=all()[idx];$('feedback').textContent=p.options.map((o,i)=>`${i+1}番「${o}」：${i===p.answer?'⭕ 正解':'❌ 不正解'}`).join('\n')+`

【解説】${p.explain}`;$('feedback').classList.remove('hide');[...$('choices').children].forEach((b,i)=>{b.disabled=true;b.classList.add(i===p.answer?'correct':'wrong')})};$('reset').onclick=render;$('next').onclick=()=>go(idx+1);$('prev').onclick=()=>go(idx-1);$('jump').onchange=e=>go(Number(e.target.value));$('add').onclick=()=>{const q=$('q').value.trim(),options=$('opts').value.split('\n').map(s=>s.trim()).filter(Boolean),answer=Number($('answer').value),explain=$('explain').value.trim();if(!q||options.length!==4||!explain){$('saveMsg').textContent='問題文、選択肢4つ、解説を入力してください。';return}custom.push({word:'追加問題',q,options,answer,explain});try{localStorage.setItem('kobun_custom',JSON.stringify(custom))}catch(e){}go(all().length-1);$('saveMsg').textContent='保存しました。';$('q').value=$('opts').value=$('explain').value=''};$('clearCustom').onclick=()=>{if(!confirm('追加した問題を削除しますか？'))return;custom=[];try{localStorage.removeItem('kobun_custom')}catch(e){}go(0);$('saveMsg').textContent='削除しました。'};render();
