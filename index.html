<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>古文慣用句 4択クイズ｜教科書258〜263ページ</title><style>
:root{font-family:system-ui,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif;color:#213c34;background:#eff7f3}*{box-sizing:border-box}body{margin:0}.wrap{max-width:820px;margin:auto;padding:20px 14px 50px}header{background:linear-gradient(130deg,#207e72,#40b9a3);color:white;padding:25px;border-radius:19px}h1{font-size:1.65rem;margin:0 0 7px}header p{margin:0;line-height:1.6}.panel{background:#fff;border-radius:18px;padding:22px;margin-top:16px;box-shadow:0 4px 20px #244b3814}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}.muted{color:#61766e;font-size:.9rem}.progress{height:9px;background:#dcece5;border-radius:30px;overflow:hidden;margin:17px 0}.fill{height:100%;background:#31aa92;transition:width .2s}.word{font-size:2rem;font-weight:750;margin:12px 0 5px}.question{font-size:1.06rem;line-height:1.9;white-space:pre-line;background:#f4faf7;border-left:4px solid #31aa92;border-radius:9px;padding:15px}.choices{display:grid;gap:9px;margin-top:17px}.choice{padding:14px;text-align:left;background:white;border:2px solid #d9e9e1;border-radius:11px;font:inherit;cursor:pointer;line-height:1.5}.choice:hover{border-color:#30a88e}.choice.correct{background:#e1f8e9;border-color:#20a16e}.choice.wrong{background:#fff0ed;border-color:#dd746b}.choice:disabled{cursor:default}.feedback{background:#f0f7f3;border-radius:11px;padding:14px;margin-top:13px;line-height:1.75;white-space:pre-wrap}.hide{display:none}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:17px}button.action{background:#228d79;border:0;color:#fff;border-radius:10px;padding:12px 15px;font:inherit;cursor:pointer}.action.secondary{background:#e4efea;color:#225144}select,input,textarea{font:inherit;border:1px solid #bfd7cc;border-radius:9px;padding:10px;max-width:100%}textarea,input{width:100%}textarea{min-height:75px}label{display:block;margin:13px 0 5px;font-weight:600}.jump{width:100%;margin-top:10px}.list{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:7px;margin-top:12px}.item{padding:10px;border:1px solid #d8e9df;background:#fff;border-radius:9px;text-align:left;cursor:pointer;font:inherit}.item.active{background:#dcf5ed;border-color:#2fa68e}.small{font-size:.82rem;color:#61776e}footer{text-align:center;color:#687b73;font-size:.84rem;margin:24px 0}@media(max-width:500px){.panel{padding:16px}.word{font-size:1.7rem}}
</style></head><body><main class="wrap"><header><h1>📚 古文慣用句 4択チェッカー</h1><p>教科書258〜263ページの写真に載っている22語だけを出題します。</p></header><section class="panel"><div class="toolbar"><strong id="counter">問題 1 / 22</strong><span id="page" class="muted"></span></div><div class="progress"><div id="fill" class="fill"></div></div><div class="word" id="word">あかず</div><div class="question" id="question">【教科書 p.258 の例文】&#10;「（更衣を）女御とだに言はせずなりぬるがあかず口惜しうおぼさるれば、」&#10;&#10;例文中の「あかず」の意味は？</div><div class="choices" id="choices"><button type="button" class="choice">1. 満足しない</button><button type="button" class="choice">2. さあ、分からない</button><button type="button" class="choice">3. 言うまでもない</button><button type="button" class="choice">4. さあ、いらっしゃい</button></div><div id="feedback" class="feedback hide" aria-live="polite"></div><div class="actions"><button class="action secondary" id="reveal">正解を見る</button><button class="action secondary" id="reset">最初から</button><button class="action secondary" id="prev">← 前へ</button><button class="action" id="next">次の問題 →</button></div><label for="jump">単語を選んで移動</label><select class="jump" id="jump"></select></section><section class="panel"><h2>収録単語一覧（22語）</h2><p class="muted">単語を押すとその問題に移動します。</p><div class="list" id="list"></div></section><footer>写真の教科書258〜263ページに載っている慣用句・意味・例文だけを使っています。</footer></main><script>
'use strict';
const entries=[{"word":"あかず（飽かず）","page":258,"meaning":"満足しない・もの足りない／飽きることがない・名残惜しい","examples":["（更衣を）女御とだに言はせずなりぬるがあかず口惜しうおぼさるれば、","愛敬ありて、言葉多からぬこそ、飽かず向かはまほしけれ。"]},{"word":"あからめもせず","page":258,"meaning":"よそ見もしない","examples":["花の本にはねぢ寄り立ち寄り、あからめもせずまもりて、"]},{"word":"あなかま","page":258,"meaning":"ああ、うるさい・静かに","examples":["あなかま、人に聞かすな。"]},{"word":"あらぬ","page":259,"meaning":"別の","examples":["あらぬものにいひなしてやみぬるつとめて、"]},{"word":"ありありて","page":259,"meaning":"生き続けて／結局","examples":["ありありてかく遥かなる国になりにたり。"]},{"word":"ありし","page":259,"meaning":"以前の・あの／生前の","examples":["わがありしかたちにもあらず、"]},{"word":"ありつる","page":259,"meaning":"先程の・例の","examples":["ありつる所に帰りて、"]},{"word":"あれかにもあらず","page":260,"meaning":"呆然としている","examples":["あれかにもあらず、現とも覚えで、"]},{"word":"いかがはせむ","page":260,"meaning":"どうしようもない","examples":["いとにくはらだたしけれども、いかがはせむ。"]},{"word":"いさ〜知らず","page":260,"meaning":"さあ、分からない","examples":["いさ、我は知らず。"]},{"word":"いざ（させ）給へ","page":260,"meaning":"さあ、いらっしゃい","examples":["「いざ給へ」とて隣なる所へ率て行く。"]},{"word":"いちのひと（一の人）","page":261,"meaning":"摂政・関白","examples":["この人の御有様はさらなり、従人も、舎人など賜はる際は、ゆゆしと見ゆ。"]},{"word":"いとしもなし","page":261,"meaning":"たいしたこともない","examples":["いとしもあらぬ御心ざしなれど、"]},{"word":"いはむかたなし","page":261,"meaning":"言いようもない","examples":["言はむ方なくむくつけなるもの来て、"]},{"word":"いふかひなし","page":262,"meaning":"言ってもかいがない／つまらない・取るに足りない","examples":["男の童の物怖ぢせず、いふかひなきを召し寄せて、"]},{"word":"〜（と）いふもおろかなり","page":262,"meaning":"（という言葉では）言い尽くせない","examples":["いと心細しと言へばおろかなり。"]},{"word":"いふもさらなり（言ふも更なり）","page":262,"meaning":"言うまでもない","examples":["軸や表紙や箱のさまなどいへばさらなりかし。","妻子どもはさらにもいはず、"]},{"word":"色に出づ","page":262,"meaning":"（こらえきれず）表情に出る","examples":["忍ぶれど色に出でにけりわが恋は物や思ふと人の問ふまで"]},{"word":"寝を寝","page":263,"meaning":"寝る","examples":["恐ろしくて寝も寝られず。"]},{"word":"えならず","page":263,"meaning":"言いようもなくすばらしい","examples":["珍しく、えならぬ調度ども並べおき、"]},{"word":"音に聞く","page":263,"meaning":"うわさに聞く","examples":["音には聞けども、いまだ見ぬ物なり。"]},{"word":"数ならず","page":263,"meaning":"ものの数ではない・取るに足りない","examples":["数ならぬ身はえ聞き候はず。"]}];
let index=0;
let answered=false;
const $=function(id){return document.getElementById(id);};
function getOptions(i){
  const chosen=[i];
  for(const offset of [5,10,15,3,8,13,18]){
    const k=(i+offset)%entries.length;
    if(!chosen.includes(k) && !chosen.some(j=>entries[j].meaning===entries[k].meaning))chosen.push(k);
    if(chosen.length===4)break;
  }
  const shift=(i*3+1)%4;
  return chosen.slice(shift).concat(chosen.slice(0,shift));
}
function render(i){
  index=(i+entries.length)%entries.length;answered=false;
  const x=entries[index];
  $('counter').textContent='問題 '+(index+1)+' / '+entries.length;
  $('page').textContent='教科書 p.'+x.page;
  $('fill').style.width=((index+1)/entries.length*100)+'%';
  $('word').textContent=x.word;
  $('question').textContent='【教科書 p.'+x.page+' の例文】\n'+x.examples.map(e=>'「'+e+'」').join('\n')+'\n\n「'+x.word+'」の意味は？';
  $('feedback').textContent='';
  $('feedback').classList.add('hide');
  $('choices').replaceChildren();
  getOptions(index).forEach((id,num)=>{
    const button=document.createElement('button');
    button.type='button';
    button.className='choice';
    button.textContent=(num+1)+'. '+entries[id].meaning;
    button.addEventListener('click',()=>check(id,button));
    $('choices').appendChild(button);
  });
  $('jump').value=String(index);
  document.querySelectorAll('.item').forEach((b,j)=>b.classList.toggle('active',j===index));
}
function check(id,button){
  if(answered)return;
  const feedback=$('feedback');
  if(id===index){
    answered=true;
    button.classList.add('correct');
    Array.from($('choices').children).forEach(b=>b.disabled=true);
    feedback.textContent='⭕ 正解！\n教科書の意味：'+entries[index].meaning;
  }else{
    button.classList.add('wrong');
    button.disabled=true;
    feedback.textContent='❌ ちがいます。別の選択肢を選んでください。';
  }
  feedback.classList.remove('hide');
}
function reveal(){
  if(answered)return;
  answered=true;
  Array.from($('choices').children).forEach(b=>{
    b.disabled=true;
    if(b.textContent.slice(b.textContent.indexOf(' ')+1)===entries[index].meaning)b.classList.add('correct');
  });
  $('feedback').textContent='教科書の意味：'+entries[index].meaning;
  $('feedback').classList.remove('hide');
}
entries.forEach((x,i)=>{
  const option=document.createElement('option');
  option.value=String(i);option.textContent=(i+1)+'. '+x.word;
  $('jump').appendChild(option);
  const button=document.createElement('button');
  button.type='button';button.className='item';button.textContent=(i+1)+'. '+x.word;
  button.addEventListener('click',()=>render(i));
  $('list').appendChild(button);
});
$('jump').addEventListener('change',e=>render(Number(e.target.value)));
$('prev').addEventListener('click',()=>render(index-1));
$('next').addEventListener('click',()=>render(index+1));
$('reset').addEventListener('click',()=>render(0));
$('reveal').addEventListener('click',reveal);
render(0);
</script></body></html>
