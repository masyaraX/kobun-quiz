<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>古文重要語 4択チェッカー</title><style>
:root{font-family:system-ui,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif;color:#213c34;background:#eff7f3}*{box-sizing:border-box}body{margin:0}.wrap{max-width:820px;margin:auto;padding:20px 14px 50px}header{background:linear-gradient(130deg,#207e72,#40b9a3);color:white;padding:25px;border-radius:19px}h1{font-size:1.65rem;margin:0 0 7px}header p{margin:0;line-height:1.6}.panel{background:#fff;border-radius:18px;padding:22px;margin-top:16px;box-shadow:0 4px 20px #244b3814}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}.muted{color:#61766e;font-size:.9rem}.progress{height:9px;background:#dcece5;border-radius:30px;overflow:hidden;margin:17px 0}.fill{height:100%;background:#31aa92;transition:width .2s}.word{font-size:2rem;font-weight:750;margin:12px 0 5px}.question{font-size:1.06rem;line-height:1.7}.choices{display:grid;gap:9px;margin-top:17px}.choice{padding:14px;text-align:left;background:white;border:2px solid #d9e9e1;border-radius:11px;font:inherit;cursor:pointer;line-height:1.5}.choice:hover{border-color:#30a88e}.choice.correct{background:#e1f8e9;border-color:#20a16e}.choice.wrong{background:#fff0ed;border-color:#dd746b}.choice:disabled{cursor:default}.feedback{background:#f0f7f3;border-radius:11px;padding:14px;margin-top:13px;line-height:1.75;white-space:pre-wrap}.hide{display:none}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:17px}button.action{background:#228d79;border:0;color:#fff;border-radius:10px;padding:12px 15px;font:inherit;cursor:pointer}.action.secondary{background:#e4efea;color:#225144}select,input,textarea{font:inherit;border:1px solid #bfd7cc;border-radius:9px;padding:10px;max-width:100%}textarea,input{width:100%}textarea{min-height:75px}label{display:block;margin:13px 0 5px;font-weight:600}.jump{width:100%;margin-top:10px}.list{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:7px;margin-top:12px}.item{padding:10px;border:1px solid #d8e9df;background:#fff;border-radius:9px;text-align:left;cursor:pointer;font:inherit}.item.active{background:#dcf5ed;border-color:#2fa68e}.small{font-size:.82rem;color:#61776e}footer{text-align:center;color:#687b73;font-size:.84rem;margin:24px 0}@media(max-width:500px){.panel{padding:16px}.word{font-size:1.7rem}}
</style></head><body><main class="wrap"><header><h1>📚 古文重要語 4択チェッカー</h1><p>「あかず」から「数ならず」まで、教科書の順番で練習。選択肢を1番上から判定できます。</p></header><section class="panel"><div class="toolbar"><strong id="counter"></strong><span id="page" class="muted"></span></div><div class="progress"><div id="fill" class="fill"></div></div><div class="word" id="word"></div><div class="question" id="question"></div><div class="choices" id="choices"></div><div id="feedback" class="feedback hide" aria-live="polite"></div><div class="actions"><button class="action secondary" id="topDown">①から順番に判定</button><button class="action secondary" id="reset">やり直す</button><button class="action secondary" id="prev">← 前へ</button><button class="action" id="next">次の問題 →</button></div><label for="jump">単語を選んで移動</label><select class="jump" id="jump"></select></section><section class="panel"><h2>収録単語一覧</h2><p class="muted">単語を押すとその問題に移動します。</p><div class="list" id="list"></div></section><section class="panel"><h2>自分の問題を追加</h2><p class="muted">追加した問題はこのブラウザに保存されます。</p><label for="q">問題文</label><textarea id="q"></textarea><label for="opts">選択肢（1行に1つ、4行）</label><textarea id="opts"></textarea><label for="answer">正解の番号</label><select id="answer"><option value="0">1番</option><option value="1">2番</option><option value="2">3番</option><option value="3">4番</option></select><label for="explain">解説</label><textarea id="explain"></textarea><div class="actions"><button class="action" id="add">問題を追加</button><button class="action secondary" id="clearCustom">追加した問題を削除</button></div><p id="saveMsg" class="muted" aria-live="polite"></p></section><footer>写真の教科書（258〜263ページ）を参考にした意味の4択練習です。例文問題ではありません。</footer></main><script>
const initial=[{"word": "あかず", "q": "「あかず」の意味として正しいものを選びなさい。", "options": ["満足しない・もの足りない", "生き続けて・結局", "摂政・関白", "表情に出る"], "answer": 0, "explain": "「飽く」の未然形＋打消「ず」。十分だと思えないこと。", "page": 258}, {"word": "あれかにもあらず", "q": "「あれかにもあらず」の意味として正しいものを選びなさい。", "options": ["以前の・昔の", "呆然としている", "たいしたこともない", "寝る"], "answer": 1, "explain": "自分が自分でないように感じ、正気を失ったような状態。", "page": 258}, {"word": "あからめもせず", "q": "「あからめもせず」の意味として正しいものを選びなさい。", "options": ["先ほどの・以前の", "言いようもない", "よそ見もしない", "言いようもなくすばらしい"], "answer": 2, "explain": "「あからめ」は脇見。ほかに目を向けないこと。", "page": 258}, {"word": "あなかま", "q": "「あなかま」の意味として正しいものを選びなさい。", "options": ["どうしようもない", "言ってもしかたがない・取るに足りない", "うわさに聞く", "ああ、うるさい・静かに"], "answer": 3, "explain": "人に静かにするよう求める表現。", "page": 258}, {"word": "あらぬ", "q": "「あらぬ」の意味として正しいものを選びなさい。", "options": ["別の・思いがけない", "さあ、分からない", "言葉では言い尽くせない", "取るに足りない"], "answer": 0, "explain": "「ある」の打消「ぬ」から、普通とは違うことを表す。", "page": 259}, {"word": "ありありて", "q": "「ありありて」の意味として正しいものを選びなさい。", "options": ["さあ、いらっしゃい", "生き続けて・結局", "言うまでもない", "満足しない・もの足りない"], "answer": 1, "explain": "長くあり続けることや、結局そうなること。", "page": 259}, {"word": "ありし", "q": "「ありし」の意味として正しいものを選びなさい。", "options": ["摂政・関白", "表情に出る", "以前の・昔の", "呆然としている"], "answer": 2, "explain": "「あり」＋過去の助動詞「き」の連体形「し」。", "page": 259}, {"word": "ありつる", "q": "「ありつる」の意味として正しいものを選びなさい。", "options": ["たいしたこともない", "寝る", "よそ見もしない", "先ほどの・以前の"], "answer": 3, "explain": "「あり」＋完了の助動詞「つ」の連体形「つる」。", "page": 259}, {"word": "いかがはせむ", "q": "「いかがはせむ」の意味として正しいものを選びなさい。", "options": ["どうしようもない", "言いようもない", "言いようもなくすばらしい", "ああ、うるさい・静かに"], "answer": 0, "explain": "「どうしたらよいだろうか」と反語的にいう。", "page": 260}, {"word": "いさ知らず", "q": "「いさ知らず」の意味として正しいものを選びなさい。", "options": ["言ってもしかたがない・取るに足りない", "さあ、分からない", "うわさに聞く", "別の・思いがけない"], "answer": 1, "explain": "「いさ」は返答をためらう気持ちを表す。", "page": 260}, {"word": "いざ給へ", "q": "「いざ給へ」の意味として正しいものを選びなさい。", "options": ["言葉では言い尽くせない", "取るに足りない", "さあ、いらっしゃい", "生き続けて・結局"], "answer": 2, "explain": "「いざ」＋「給へ」。相手を誘い、連れていくときの言い方。", "page": 260}, {"word": "いちのひとへの人", "q": "「いちのひとへの人」の意味として正しいものを選びなさい。", "options": ["言うまでもない", "満足しない・もの足りない", "以前の・昔の", "摂政・関白"], "answer": 3, "explain": "「一の人」は朝廷で最も高い地位の人を指すことがある。", "page": 261}, {"word": "いとしもなし", "q": "「いとしもなし」の意味として正しいものを選びなさい。", "options": ["たいしたこともない", "表情に出る", "呆然としている", "先ほどの・以前の"], "answer": 0, "explain": "「いとしも」＋打消。特にすばらしいわけではない。", "page": 261}, {"word": "いはむかたなし", "q": "「いはむかたなし」の意味として正しいものを選びなさい。", "options": ["寝る", "言いようもない", "よそ見もしない", "どうしようもない"], "answer": 1, "explain": "言葉では表現できないほどだという意味。", "page": 261}, {"word": "いふかひなし", "q": "「いふかひなし」の意味として正しいものを選びなさい。", "options": ["言いようもなくすばらしい", "ああ、うるさい・静かに", "言ってもしかたがない・取るに足りない", "さあ、分からない"], "answer": 2, "explain": "言葉にしても無駄、価値がないという意味。", "page": 262}, {"word": "（と）いふもおろかなり", "q": "「（と）いふもおろかなり」の意味として正しいものを選びなさい。", "options": ["うわさに聞く", "別の・思いがけない", "さあ、いらっしゃい", "言葉では言い尽くせない"], "answer": 3, "explain": "「～と言うのでは十分ではない」という意味。", "page": 262}, {"word": "いふもさらなり", "q": "「いふもさらなり」の意味として正しいものを選びなさい。", "options": ["言うまでもない", "取るに足りない", "生き続けて・結局", "摂政・関白"], "answer": 0, "explain": "改めて言う必要がないほど当然だという意味。", "page": 262}, {"word": "色に出づ", "q": "「色に出づ」の意味として正しいものを選びなさい。", "options": ["満足しない・もの足りない", "表情に出る", "以前の・昔の", "たいしたこともない"], "answer": 1, "explain": "心に思っていることが顔色や態度に現れる。", "page": 262}, {"word": "寝を寝", "q": "「寝を寝」の意味として正しいものを選びなさい。", "options": ["呆然としている", "先ほどの・以前の", "寝る", "言いようもない"], "answer": 2, "explain": "「寝（い）を寝（ぬ）」は「寝ること」を表す。", "page": 263}, {"word": "えならず", "q": "「えならず」の意味として正しいものを選びなさい。", "options": ["よそ見もしない", "どうしようもない", "言ってもしかたがない・取るに足りない", "言いようもなくすばらしい"], "answer": 3, "explain": "「え」＋「ならず」。何とも言えないほどよい。", "page": 263}, {"word": "音に聞く", "q": "「音に聞く」の意味として正しいものを選びなさい。", "options": ["うわさに聞く", "ああ、うるさい・静かに", "さあ、分からない", "言葉では言い尽くせない"], "answer": 0, "explain": "実際に見聞きする前に評判を耳にすること。", "page": 263}, {"word": "数ならず", "q": "「数ならず」の意味として正しいものを選びなさい。", "options": ["別の・思いがけない", "取るに足りない", "さあ、いらっしゃい", "言うまでもない"], "answer": 1, "explain": "数に入らないほど、身分や価値が低いこと。", "page": 263}];let custom=[];try{custom=JSON.parse(localStorage.getItem('kobun_custom')||'[]');if(!Array.isArray(custom))custom=[]}catch(e){}let idx=0;const $=id=>document.getElementById(id),all=()=>[...initial,...custom];function go(i){idx=(i+all().length)%all().length;render()}function render(){const p=all()[idx];$('counter').textContent=`問題 ${idx+1} / ${all().length}`;$('page').textContent=p.page?`教科書 p.${p.page}`:'追加した問題';$('fill').style.width=`${(idx+1)/all().length*100}%`;$('word').textContent=p.word||'追加問題';$('question').textContent=p.q;$('feedback').classList.add('hide');$('feedback').textContent='';$('choices').replaceChildren();p.options.forEach((o,i)=>{const b=document.createElement('button');b.className='choice';b.textContent=`${i+1}. ${o}`;b.onclick=()=>check(i);$('choices').appendChild(b)});$('jump').replaceChildren();$('list').replaceChildren();all().forEach((e,i)=>{const opt=document.createElement('option');opt.value=i;opt.textContent=`${i+1}. ${e.word||'追加問題'}`;$('jump').appendChild(opt);const b=document.createElement('button');b.className='item'+(idx===i?' active':'');b.textContent=`${i+1}. ${e.word||'追加問題'}`;b.onclick=()=>go(i);$('list').appendChild(b)});$('jump').value=String(idx)}function check(i){const p=all()[idx],buttons=[...$('choices').children],f=$('feedback');buttons[i].classList.add(i===p.answer?'correct':'wrong');buttons[i].disabled=true;f.classList.remove('hide');if(i===p.answer){f.textContent=`⭕ 正解！ ${i+1}番「${p.options[i]}」
${p.explain}`;buttons.forEach((b,j)=>{b.disabled=true;if(j===p.answer)b.classList.add('correct')})}else{f.textContent=`❌ ${i+1}番は不正解。別の選択肢を選んでください。`}}$('topDown').onclick=()=>{const p=all()[idx];$('feedback').textContent=p.options.map((o,i)=>`${i+1}番「${o}」：${i===p.answer?'⭕ 正解':'❌ 不正解'}`).join('
')+`

【解説】${p.explain}`;$('feedback').classList.remove('hide');[...$('choices').children].forEach((b,i)=>{b.disabled=true;b.classList.add(i===p.answer?'correct':'wrong')})};$('reset').onclick=render;$('next').onclick=()=>go(idx+1);$('prev').onclick=()=>go(idx-1);$('jump').onchange=e=>go(Number(e.target.value));$('add').onclick=()=>{const q=$('q').value.trim(),options=$('opts').value.split('
').map(s=>s.trim()).filter(Boolean),answer=Number($('answer').value),explain=$('explain').value.trim();if(!q||options.length!==4||!explain){$('saveMsg').textContent='問題文、選択肢4つ、解説を入力してください。';return}custom.push({word:'追加問題',q,options,answer,explain});try{localStorage.setItem('kobun_custom',JSON.stringify(custom))}catch(e){}go(all().length-1);$('saveMsg').textContent='保存しました。';$('q').value=$('opts').value=$('explain').value=''};$('clearCustom').onclick=()=>{if(!confirm('追加した問題を削除しますか？'))return;custom=[];try{localStorage.removeItem('kobun_custom')}catch(e){}go(0);$('saveMsg').textContent='削除しました。'};render();
</script></body></html>
