:root{font-family:system-ui,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif;color:#213c34;background:#eff7f3}*{box-sizing:border-box}body{margin:0}.wrap{max-width:820px;margin:auto;padding:20px 14px 50px}header{background:linear-gradient(130deg,#207e72,#40b9a3);color:white;padding:25px;border-radius:19px}h1{font-size:1.65rem;margin:0 0 7px}header p{margin:0;line-height:1.6}.panel{background:#fff;border-radius:18px;padding:22px;margin-top:16px;box-shadow:0 4px 20px #244b3814}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}.muted{color:#61766e;font-size:.9rem}.progress{height:9px;background:#dcece5;border-radius:30px;overflow:hidden;margin:17px 0}.fill{height:100%;background:#31aa92;transition:width .2s}.word{font-size:2rem;font-weight:750;margin:12px 0 5px}.question{font-size:1.06rem;line-height:1.7}.choices{display:grid;gap:9px;margin-top:17px}.choice{padding:14px;text-align:left;background:white;border:2px solid #d9e9e1;border-radius:11px;font:inherit;cursor:pointer;line-height:1.5}.choice:hover{border-color:#30a88e}.choice.correct{background:#e1f8e9;border-color:#20a16e}.choice.wrong{background:#fff0ed;border-color:#dd746b}.choice:disabled{cursor:default}.feedback{background:#f0f7f3;border-radius:11px;padding:14px;margin-top:13px;line-height:1.75;white-space:pre-wrap}.hide{display:none}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:17px}button.action{background:#228d79;border:0;color:#fff;border-radius:10px;padding:12px 15px;font:inherit;cursor:pointer}.action.secondary{background:#e4efea;color:#225144}select,input,textarea{font:inherit;border:1px solid #bfd7cc;border-radius:9px;padding:10px;max-width:100%}textarea,input{width:100%}textarea{min-height:75px}label{display:block;margin:13px 0 5px;font-weight:600}.jump{width:100%;margin-top:10px}.list{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:7px;margin-top:12px}.item{padding:10px;border:1px solid #d8e9df;background:#fff;border-radiu </style></head><body><main class="wrap"><header><h1>📚 古文重要語 4択チェッカー</h1><p>「あかず」から「数ならず」まで、教科書の順番で練習。選択肢を1番上から判定できます。</p></header><section class="panel"><div class="toolbar"><strong id="counter">問題 1 / 31</strong><span id="page" class="muted"></span></div><div class="progress"><div id="fill" class="fill"></div></div><div class="word" id="word">あかず</div><div class="question" id="question">「あかず」の意味（1/2）として正しいものを選びなさい。</div><div class="choices" id="choices"><button class="choice" type="button" onclick="this.parentNode.nextElementSibling.textContent='⭕ 正解！';this.parentNode.nextElementSibling.classList.remove('hide')">1. 満足しない</button><button class="choice" type="button" onclick="this.parentNode.nextElementSibling.textContent='❌ 不正解';this.parentNode.nextElementSibling.classList.remove('hide')">2. 呆然としている</button><button class="choice" type="button" onclick="this.parentNode.nextElementSibling.textContent='❌ 不正解';this.parentNode.nextElementSibling.classList.remove('hide')">3. どうしようもない</button><button class="choice" type="button" onclick="this.parentNode.nextElementSibling.textContent='❌ 不正解';this.parentNode.nextElementSibling.classList.remove('hide')">4. 表情に出る</button></div><div id="feedback" class="feedback hide" aria-live="polite"></div><div class="actions"><button class="action secondary" id="topDown">①から順番に判定</button><button class="action secondary" id="reset">やり直す</button><button class="action secondary" id="prev">← 前へ</button><button class="action" id="next">次の問題 →</button></div><label for="jump">単語を選んで移動</label><select class="jump" id="jump"></select></section><section class="panel"><h2>収録単語一覧</h2><p class="muted">単語を押すとその問題に移動します。</p><div class="list" id="list"></div></section><section class="panel"><h2>自分の問題を追加</h2><p class="muted">追加した問題はこのブラウザに保存されます。</p><label for="q">問題文</label><textarea id="q"></textarea><label for="opts">選択肢（1行に1つ、4行）</label><textarea id="opts"></textarea><label for="answer">正解の番号</label><select id="answer"><option value="0">1番</option><option value="1">2番</option><option value="2">3番</option><option value="3">4番</option></select><label for="explain">解説</label><textarea id="explain"></textarea><div class="actions"><button class="action" id="add">問題を追加</button><button class="action secondary" id="clearCustom">追加した問題を削除</button></div><p id="saveMsg" class="muted" aria-live="polite"></p></section><footer>写真の教科書（258〜263ページ）を参考にした意味の4択練習です。例文問題ではありません。</footer></main><script>

。","options":["あの","言うまでもない","静かに","以前の"],"answer":3,"explain":"すでにあったことを振り返る。","page":259},{"word":"いかがはせむ","q":"「いかがはせむ」の意味として正しいものを選びなさい。","options":["言いようもなくすばらしい","生き続けて","どうしようもない","さあ、いらっしゃい"],"answer":2,"explain":"「どうしたらよいだろうか、いや、どうにもならない」の反語。","page":260},{"word":"いさ知らず","q":"「いさ知らず」の意味として正しいものを選びなさい。","options":["摂政","さあ、分からない","言葉では言い尽くせない","ああ、うるさい"],"answer":1,"explain":"返答をためらい、分からないと言う。","page":260},{"word":"いざ給へ","q":"「いざ給へ」の意味として正しいものを選びなさい。","options":["さあ、いらっしゃい","満足しない","あの","言うまでもない"],"answer":0,"explain":"相手を誘って同行を促す言い方。","page":260},{"word":"いちのひとへの人","q":"「いちのひとへの人」の意味（1/2）として正しいものを選びなさい。","options":["あの","表情に出る","別の","摂政"],"answer":3,"explain":"朝廷で最も高い地位にある人物を指す。","page":261},{"word":"いちのひとへの人","q":"「いちのひとへの人」の意味（2/2）として正しいものを選びなさい。","options":["呆然としている","どうしようもない","関白","言ってもしかたがない"],"answer":2,"explain":"「一の人」の指す役職の一つ。","page":261},{"word":"いとしもなし","q":"「いとしもなし」の意味として正しいものを選びなさい。","options":["さあ、いらっしゃい","たいしたこともない","言葉では言い尽くせない","ああ、うるさい"],"answer":1,"explain":"特に優れているというほどではない。","page":261},{"word":"いはむかたなし","q":"「いはむかたなし」の意味として正しいものを選びなさい。","options":["言いようもない","満足しない","あの","言うまでもない"],"answer":0,"explain":"言葉で表しきれないほどだ。","page":261},{"word":"いふかひなし","q":"「いふかひなし」の意味（1/2）として正しいものを選びなさい。","options":["先ほどの","寝る","思いがけない","言ってもしかたがない"],"answer":3,"explain":"言葉にしても無駄である。","page":262},{"word":"いふかひなし","q":"「いふかひなし」の意味（2/2）として正しいものを選びなさい。","options":["よそ見もしない","さあ、分からない","取るに足りない","言いようもない"],"answer":2,"explain":"価値がない・つまらない。","page":262},{"word":"（と）いふもおろかなり","q":"「（と）いふもおろかなり」の意味として正しいものを選びなさい。","options":["さあ、いらっしゃい","言葉では言い尽くせない","取るに足りない","ああ、うるさい"],"answer":1,"explain":"言うだけでは十分に表せない。","page":262},{"word":"いふもさらなり","q":"「いふもさらなり」の意味として正しいものを選びなさい。","options":["言うまでもない","満足しない","あの","言葉では言い尽くせない"],"answer":0,"explain":"あえて言う必要もない。","page":262},{"word":"色に出づ","q":"「色に出づ」の意味として正しいものを選びなさい。","options":["思いがけない","たいしたこともない","もの足りない","表情に出る"],"answer":3,"explain":"思いが顔色や態度に表れる。","page":262},{"word":"寝を寝","q":"「寝を寝」の意味として正しいものを選びなさい。","options":[ ')+`
